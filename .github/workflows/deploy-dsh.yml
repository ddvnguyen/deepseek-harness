# DSH deploy - dispatch-only workflow (Pipeline 2 follow-up; base: dsh#02 bfcd04bd).
# One workflow, two target branches. x is armed on the existing standby runner
# labels; z stays unarmed: its step needs the NOT-advertised prod label and the
# human's prod-z environment gate, so it queues forever until the human arms it.
# The dsh-clouds unit stays disabled and untouched (a duplicate unit over one
# registration - Architect ruling, CI/CD lane rev 5254).
name: deploy-dsh
"on":
  workflow_dispatch:
    inputs:
      target:
        description: "deploy target: x (dsh-x.ddvnguyen.com:3181) or z (dsh-z.ddvnguyen.com:3180, unarmed)"
        type: choice
        default: x
        options: [x, z]
      fork_sha:
        description: "full 40-char sha of the product checkout to package (deepseek-harness)"
        required: true
      dry_run:
        description: "1 stops after the scratch rehearsal without touching the live service"
        type: choice
        default: "0"
        options: ["0", "1"]

# one dispatch at a time; never overlap a deploy (the runner serialises against
# the standby push job on the same runner anyway)
concurrency:
  group: dsh-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-x:
    if: inputs.target == 'x'
    runs-on: [self-hosted, linux, x64, vm-backup]
    steps:
      - name: checkout product at fork_sha
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fork_sha }}
      - name: assert the checked-out sha equals the dispatched fork_sha
        run: test "$(git rev-parse HEAD)" = "${{ inputs.fork_sha }}" || { echo 'sha mismatch'; exit 4; }
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: build product
        run: pnpm run build
      - name: checkout harness pin
        uses: actions/checkout@v4
        with:
          ref: 19caaf271abf0d380f48d125b1d9548a53be8793
          path: harness-pin
      - name: deploy (TARGET=x)
        run: bash scripts/deploy/dsh-deploy.sh
        env:
          TARGET: x
          DRY_RUN: ${{ inputs.dry_run }}
          REPO_ROOT: ${{ github.workspace }}
          HARNESS_ROOT: ${{ github.workspace }}/harness-pin
          HARNESS_SHA_EXPECT: 19caaf271abf0d380f48d125b1d9548a53be8793
          TRUSTED_HOST: dsh-x.ddvnguyen.com
  deploy-z:
    if: inputs.target == 'z'
    # UNARMED by design: no runner advertises prod, so this never schedules;
    # the prod-z environment gates approval once the human arms it.
    environment: prod-z
    runs-on: [self-hosted, prod]
    steps:
      - name: refusal step (target z is not armed)
        run: |
          echo "TARGET=z is unarmed: arming needs this file edited + a runner with the prod label."
          exit 3
