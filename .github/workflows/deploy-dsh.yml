# DSH deploy - dispatch-only workflow for the fork's own lanes.
#
# One workflow, two lanes, both real: x (dsh-x.ddvnguyen.com:3181) and z
# (dsh-z.ddvnguyen.com:3180). Both are rotating TEST lanes; z is no longer
# "unarmed" and is deployed exactly like x, with TARGET=z.
#
# The PROD lane is out of scope for this file: it is the stock upstream harness
# on :3080, it is reached through the `prod` runner label and the `prod-z`
# environment, and neither is referenced here. No job below can schedule onto
# the `prod` runner or into the `prod-z` environment - those stay reserved for
# the unarmed PROD lane.
#
# The deploy script runs from the REVIEWED ref (github.sha), checked out into
# ./deploy-scripts: the product checkout at fork_sha never supplies the
# script, so a dispatched sha cannot run unreviewed deploy code. REPO_ROOT stays
# the product tree; the collection of deploy vars is pushed through env:.
#
# The former `target` input is now `lane` (same x|z choices, default x).
#
# The moct repo owns the train and drives the FULL lane deploy (customizations
# + release) from deploy/dsh-customizations.json and deploy/train-repos.json.
# This file keeps the fork's own dispatch entry point working and consistent
# with it.
name: deploy-dsh
"on":
  workflow_dispatch:
    inputs:
      lane:
        description: "lane to deploy: x (dsh-x.ddvnguyen.com:3181) or z (dsh-z.ddvnguyen.com:3180)"
        type: choice
        default: x
        options: [x, z]
      fork_sha:
        description: "full 40-char sha of the product commit to package (deepseek-harness)"
        required: true

# one dispatch at a time; the runner serialises against the standby push job
concurrency:
  group: dsh-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-x:
    if: inputs.lane == 'x'
    runs-on: [self-hosted, linux, x64, vm-backup]
    env:
      FORK_SHA: ${{ inputs.fork_sha }}
      LANE: ${{ inputs.lane }}
      DRY_RUN: "0"
    steps:
      - name: validate FORK_SHA (strict 40-hex; no untrusted interpolation into shell)
        run: echo "$FORK_SHA" | grep -Eq "^[0-9a-f]{40}$" || { echo "fork_sha must be a full 40-char sha"; exit 4; }
      - name: validate the lane (only the two rotating test lanes; never prod)
        run: |
          set -euo pipefail
          case "$LANE" in
            x) PORT=3181 ;;
            z) PORT=3180 ;;
            *) echo "unknown lane [$LANE]: only x and z are in scope"; exit 4 ;;
          esac
          # The PROD lane (3080), the TEST fleet (3081, 8110) and MOCT-X (8210)
          # are never deployed from here.
          case "$PORT" in
            3080|3081|8110|8210) echo "refusing to deploy on protected port $PORT"; exit 3 ;;
          esac
          echo "deploying lane $LANE on port $PORT"
      - name: checkout product at FORK_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fork_sha }}
        id: product
      - name: assert the checked-out sha equals FORK_SHA (env-read, not inline)
        run: test "$(git rev-parse HEAD)" = "$FORK_SHA" || { echo "sha mismatch"; exit 4; }
      - name: checkout the reviewed workflow ref with the deploy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: deploy-scripts
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: build product
        run: pnpm run build
      - name: checkout harness pin
        uses: actions/checkout@v4
        with:
          ref: 19caaf271abf0d380f48d125b1d9548a53be8793
          path: harness-pin
      - name: deploy (TARGET=x; script from the reviewed ref, product tree as-is)
        run: bash deploy-scripts/scripts/deploy/dsh-deploy.sh
        env:
          TARGET: x
          DRY_RUN: ${{ env.DRY_RUN }}
          REPO_ROOT: ${{ github.workspace }}
          HARNESS_ROOT: ${{ github.workspace }}/harness-pin
          HARNESS_SHA_EXPECT: 19caaf271abf0d380f48d125b1d9548a53be8793
          CLOUDS_ROOT: /mnt/workspace/clouds
          SERVICE: dsh-x
          TRUSTED_HOST: dsh-x.ddvnguyen.com
          GITHUB_REPOSITORY: ${{ github.repository }}
  deploy-z:
    if: inputs.lane == 'z'
    # Lane z is a rotating TEST lane, not PROD: same runner labels as lane x,
    # no `prod` label and no `prod-z` environment. It deploys with TARGET=z.
    runs-on: [self-hosted, linux, x64, vm-backup]
    env:
      FORK_SHA: ${{ inputs.fork_sha }}
      LANE: ${{ inputs.lane }}
      DRY_RUN: "0"
    steps:
      - name: validate FORK_SHA (strict 40-hex; no untrusted interpolation into shell)
        run: echo "$FORK_SHA" | grep -Eq "^[0-9a-f]{40}$" || { echo "fork_sha must be a full 40-char sha"; exit 4; }
      - name: validate the lane (only the two rotating test lanes; never prod)
        run: |
          set -euo pipefail
          case "$LANE" in
            x) PORT=3181 ;;
            z) PORT=3180 ;;
            *) echo "unknown lane [$LANE]: only x and z are in scope"; exit 4 ;;
          esac
          # The PROD lane (3080), the TEST fleet (3081, 8110) and MOCT-X (8210)
          # are never deployed from here.
          case "$PORT" in
            3080|3081|8110|8210) echo "refusing to deploy on protected port $PORT"; exit 3 ;;
          esac
          echo "deploying lane $LANE on port $PORT"
      - name: checkout product at FORK_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fork_sha }}
        id: product
      - name: assert the checked-out sha equals FORK_SHA (env-read, not inline)
        run: test "$(git rev-parse HEAD)" = "$FORK_SHA" || { echo "sha mismatch"; exit 4; }
      - name: checkout the reviewed workflow ref with the deploy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: deploy-scripts
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: build product
        run: pnpm run build
      - name: checkout harness pin
        uses: actions/checkout@v4
        with:
          ref: 19caaf271abf0d380f48d125b1d9548a53be8793
          path: harness-pin
      - name: deploy (TARGET=z; script from the reviewed ref, product tree as-is)
        run: bash deploy-scripts/scripts/deploy/dsh-deploy.sh
        env:
          TARGET: z
          DRY_RUN: ${{ env.DRY_RUN }}
          REPO_ROOT: ${{ github.workspace }}
          HARNESS_ROOT: ${{ github.workspace }}/harness-pin
          HARNESS_SHA_EXPECT: 19caaf271abf0d380f48d125b1d9548a53be8793
          CLOUDS_ROOT: /mnt/workspace/clouds
          SERVICE: dsh-z
          TRUSTED_HOST: dsh-z.ddvnguyen.com
          GITHUB_REPOSITORY: ${{ github.repository }}
